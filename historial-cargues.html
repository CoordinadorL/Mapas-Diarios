<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="icon-192.png">
<title>Mapas Diarios — Historial de Cargues</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0f172a;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}

.topbar{background:linear-gradient(90deg,#1e293b,#0f172a);padding:6px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #a855f7;flex-shrink:0;gap:8px;flex-wrap:wrap}
.topbar h1{font-size:.82rem;font-weight:700;letter-spacing:.3px;color:#f1f5f9}
.topbar-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:4px;background:#1e293b;border:1px solid #475569;border-radius:18px;padding:2px 8px;font-size:.6rem;color:#cbd5e1;font-weight:700;text-decoration:none;cursor:pointer}
button.badge{font-family:inherit}

.toolbar{background:#111827;border-bottom:1px solid #1e293b;padding:6px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex-shrink:0}
.fecha-inline{display:flex;align-items:center;gap:4px}
.fecha-inline span{font-size:.6rem;color:#64748b}
.fecha-inline input[type=date]{background:#1e293b;color:#fff;border:1px solid #334155;border-radius:5px;padding:3px 6px;font-size:.7rem;color-scheme:dark}
#hist-btn-buscar{background:#1d4ed8;color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:.68rem;font-weight:700;cursor:pointer}

.main{flex:1;display:flex;overflow:hidden}
.hist-lista-wrap{flex:1;overflow-y:auto;padding:10px 12px}
aside.hist-mapa-aside{width:340px;flex-shrink:0;background:#111827;border-left:1px solid #1e293b;display:flex;flex-direction:column}
aside.hist-mapa-aside h3{font-size:.62rem;text-transform:uppercase;letter-spacing:.6px;color:#94a3b8;padding:8px 10px 4px}
#hist-map{flex:1}
#hist-map-vacio{padding:10px;font-size:.68rem;color:#64748b;font-style:italic}

.hist-dia{margin-bottom:14px;border:1px solid #1e293b;border-radius:8px;overflow:hidden}
.hist-dia-header{display:flex;justify-content:space-between;align-items:baseline;padding:6px 10px;background:#1e293b;gap:8px;flex-wrap:wrap}
.hist-dia-header b{color:#f1f5f9;font-size:.8rem}
.hist-dia-header span{color:#94a3b8;font-size:.68rem}
.hist-fila{display:grid;grid-template-columns:1.3fr 1fr 1.6fr .7fr .7fr .9fr 30px;gap:6px;align-items:center;padding:5px 10px;font-size:.74rem;border-bottom:1px solid #1e293b}
.hist-fila:last-child{border-bottom:none}
.hist-fila-header{color:#94a3b8;font-size:.6rem;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid #334155}
.hist-num{text-align:right}
.hist-monto{font-weight:700;color:#fff}
.hist-usuario{color:#94a3b8}
.hist-vend{color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-btn-mapa{background:none;border:none;cursor:pointer;color:#94a3b8;font-size:.8rem;padding:2px 4px;border-radius:4px;font-family:inherit}
.hist-btn-mapa:hover{background:#334155;color:#fff}
.hist-btn-mapa:disabled{opacity:.25;cursor:default}
.hist-fila-activa{background:#1e3a5f}

@media (max-width:760px){
  .main{flex-direction:column}
  aside.hist-mapa-aside{width:100%;height:34vh;border-left:none;border-top:1px solid #1e293b}
  .hist-fila{grid-template-columns:1.2fr .9fr 1fr .6fr .6fr .8fr 24px;font-size:.68rem}
}
</style>
</head>
<body>

<div class="topbar">
  <h1>🗓️ HISTORIAL DE CARGUES</h1>
  <div class="topbar-right">
    <a class="badge" href="resumen.html" title="Volver al resumen">📈 Resumen rutas</a>
    <a class="badge" href="cargue.html" title="Ir al Mapa de Cargue">📍 Mapa de Cargue</a>
    <div class="badge" onclick="logout()" title="Cerrar sesión">👤 <span id="user-name">—</span> · <span id="user-rol">—</span> ⏻</div>
  </div>
</div>

<div class="toolbar">
  <div class="fecha-inline"><span>Desde</span><input type="date" id="hist-fecha-desde"></div>
  <div class="fecha-inline"><span>Hasta</span><input type="date" id="hist-fecha-hasta"></div>
  <button type="button" id="hist-btn-buscar">🔍 Buscar</button>
</div>

<div class="main">
  <div class="hist-lista-wrap">
    <div id="hist-resultados"><p style="color:#64748b;font-size:.8rem;padding:10px">Elegí un rango de fechas y tocá Buscar.</p></div>
  </div>
  <aside class="hist-mapa-aside">
    <h3>Geocerca del cargue</h3>
    <div id="hist-map-vacio">Tocá el 🗺️ de un cargue para ver su forma acá.</div>
    <div id="hist-map" style="display:none"></div>
  </aside>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwzQRnCJHFXni_9Qvs9kh_6BoikPDtb2sAMNChS3gSk9gAn5e31z5PFvKRGRzeoFqK5og/exec";
function getSesion(){ try{ return JSON.parse(localStorage.getItem('sesionActiva')||'null'); }catch(e){ return null; } }
function getToken(){ const s=getSesion(); return (s&&s.token)||''; }
let _redirigiendoLogin=false;
function sesionExpirada(){
  if(_redirigiendoLogin) return;
  _redirigiendoLogin=true;
  try{ localStorage.removeItem('sesionActiva'); }catch(e){}
  alert('Tu sesión expiró o no es válida. Ingresa de nuevo.');
  window.location.href='login.html';
}
function logout(){ if(!confirm('¿Cerrar sesión?'))return; localStorage.removeItem('sesionActiva'); window.location.href='login.html'; }

const ROLES_CARGUE=['admin','bodega','coordinador'];
const sesion=getSesion();
if(!sesion || !sesion.rol){ window.location.href='login.html'; }
else if(!ROLES_CARGUE.includes(sesion.rol)){ window.location.href='mapa_live_F150.html'; }

document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('user-name').textContent = sesion ? sesion.usuario : '—';
  document.getElementById('user-rol').textContent = sesion ? sesion.rol.toUpperCase() : '—';

  initHistCarguesMapa('hist-map');
  initHistCarguesFiltro();
  buscarHistCargues();
});
</script>
<script src="cargue-utils.js"></script>
<script src="cargue-api.js"></script>
<script src="historial-cargues.js"></script>
</body>
</html>
