<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="icon-192.png">
<title>Mapas Diarios — Historial de Cargues</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0f172a;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}

.topbar{background:linear-gradient(90deg,#1e293b,#0f172a);padding:6px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #a855f7;flex-shrink:0;gap:8px;flex-wrap:wrap}
.topbar h1{font-size:.82rem;font-weight:700;letter-spacing:.3px;color:#f1f5f9}
.topbar-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:4px;background:#1e293b;border:1px solid #475569;border-radius:18px;padding:2px 8px;font-size:.6rem;color:#cbd5e1;font-weight:700;text-decoration:none;cursor:pointer}
button.badge{font-family:inherit}

.toolbar{background:#111827;border-bottom:1px solid #1e293b;padding:6px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex-shrink:0}
.fecha-inline{display:flex;align-items:center;gap:4px}
.fecha-inline span{font-size:.6rem;color:#64748b}
.fecha-inline input[type=date]{background:#1e293b;color:#fff;border:1px solid #334155;border-radius:5px;padding:3px 6px;font-size:.7rem;color-scheme:dark}
#hist-btn-buscar{background:#1d4ed8;color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:.68rem;font-weight:700;cursor:pointer}

.main{flex:1;display:flex;overflow:hidden}
.hist-lista-wrap{flex:1;overflow-y:auto;padding:10px 12px}
aside.hist-mapa-aside{width:340px;flex-shrink:0;background:#111827;border-left:1px solid #1e293b;display:flex;flex-direction:column}
aside.hist-mapa-aside h3{font-size:.62rem;text-transform:uppercase;letter-spacing:.6px;color:#94a3b8;padding:8px 10px 4px}
#hist-map{flex:1}
#hist-map-vacio{padding:10px;font-size:.68rem;color:#64748b;font-style:italic}

.hist-dia{margin-bottom:14px;border:1px solid #1e293b;border-radius:8px;overflow:hidden}
.hist-dia-header{display:flex;justify-content:space-between;align-items:baseline;padding:6px 10px;background:#1e293b;gap:8px;flex-wrap:wrap}
.hist-dia-header b{color:#f1f5f9;font-size:.8rem}
.hist-dia-header span{color:#94a3b8;font-size:.68rem}
.hist-fila{display:grid;grid-template-columns:14px 1.3fr 1.6fr .7fr .7fr .9fr 30px;gap:6px;align-items:center;padding:5px 10px;font-size:.74rem}
.hist-fila-header{color:#94a3b8;font-size:.6rem;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid #334155}
.hist-num{text-align:right}
.hist-monto{font-weight:700;color:#fff}
.hist-usuario{color:#94a3b8;font-weight:400}
.hist-vend{color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-btn-mapa{background:none;border:none;cursor:pointer;color:#94a3b8;font-size:.8rem;padding:2px 4px;border-radius:4px;font-family:inherit}
.hist-btn-mapa:hover{background:#334155;color:#fff}
.hist-btn-mapa:disabled{opacity:.25;cursor:default}

/* Fila de cargue desplegable (▸/▾) con detalle pedido por pedido agrupado
   por vendedor -- mismo patrón que .rc-fila-detalle en cargue.html
   (cargue-resumen.js), adaptado acá para el reporte de solo lectura. */
.hist-fila-detalle{border-bottom:1px solid #1e293b}
.hist-fila-detalle:last-child{border-bottom:none}
.hist-fila-detalle summary{list-style:none;cursor:pointer}
.hist-fila-detalle summary::-webkit-details-marker{display:none}
.hist-fila-detalle summary::marker{content:''}
.hist-fila-detalle:hover summary{background:#1e293b}
.hist-fila-detalle.hist-fila-activa summary{background:#1e3a5f}
.hist-caret::before{content:'▸';color:#64748b;display:inline-block}
.hist-fila-detalle[open] .hist-caret::before{content:'▾';color:#93c5fd}
.hist-detalle{padding:2px 10px 10px 26px;display:flex;flex-direction:column;gap:8px}
.hist-sin-detalle{color:#64748b;font-size:.72rem;padding:4px 0}
.rcd-vendedor summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:5px}
.rcd-vendedor summary::-webkit-details-marker{display:none}
.rcd-vendedor summary::marker{content:''}
.rcd-vendedor:hover summary{opacity:.85}
.rcd-caret::before{content:'▸';color:#64748b;display:inline-block;font-size:.65rem}
.rcd-vendedor[open] .rcd-caret::before{content:'▾';color:#93c5fd}
.rcd-vendedor b{color:#93c5fd;font-size:.72rem}
.rcd-vendedor-total{color:#94a3b8;font-weight:400;font-size:.68rem}
.rcd-vendedor ul{list-style:none;margin-top:3px;padding-left:14px;display:flex;flex-direction:column;gap:2px}
.rcd-vendedor li{font-size:.7rem;color:#cbd5e1;padding-left:6px;border-left:2px solid #334155}

@media (max-width:760px){
  .main{flex-direction:column}
  aside.hist-mapa-aside{width:100%;height:34vh;border-left:none;border-top:1px solid #1e293b}
  .hist-fila{grid-template-columns:12px 1.2fr 1fr .6fr .6fr .8fr 24px;font-size:.68rem}
}
</style>
</head>
<body>

<div class="topbar">
  <h1>🗓️ HISTORIAL DE CARGUES</h1>
  <div class="topbar-right">
    <a class="badge" id="nav-resumen-rutas" href="resumen.html" title="Volver al resumen">📈 Resumen rutas</a>
    <a class="badge" id="nav-mapa-cargue" href="cargue.html" title="Ir al Mapa de Cargue">📍 Mapa de Cargue</a>
    <div class="badge" onclick="logout()" title="Cerrar sesión">👤 <span id="user-name">—</span> · <span id="user-rol">—</span> ⏻</div>
  </div>
</div>

<div class="toolbar">
  <div class="fecha-inline"><span>Desde</span><input type="date" id="hist-fecha-desde"></div>
  <div class="fecha-inline"><span>Hasta</span><input type="date" id="hist-fecha-hasta"></div>
  <button type="button" id="hist-btn-buscar">🔍 Buscar</button>
</div>

<div class="main">
  <div class="hist-lista-wrap">
    <div id="hist-resultados"><p style="color:#64748b;font-size:.8rem;padding:10px">Elegí un rango de fechas y tocá Buscar.</p></div>
  </div>
  <aside class="hist-mapa-aside">
    <h3>Geocerca del cargue</h3>
    <div id="hist-map-vacio">Tocá el 🗺️ de un cargue para ver su forma acá.</div>
    <div id="hist-map" style="display:none"></div>
  </aside>
</div>

<script>
// Registro del Service Worker + aviso de nueva versión (igual que
// resumen.html) -- historial-cargues.html no lo tenía, así que quien entra
// directo acá (rol facturador, que no pasa por login/resumen) podía quedar
// con una copia vieja cacheada para siempre sin ningún aviso ni forma de
// refrescarla sola.
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      setInterval(()=>reg.update().catch(()=>{}), 5*60*1000);
    }).catch(()=>{});
  });
  let controllerYaExistia = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(!controllerYaExistia){ controllerYaExistia = true; return; }
    avisarNuevaVersion();
  });
}
function avisarNuevaVersion(){
  if(document.getElementById('nueva-version-toast')) return;
  const div = document.createElement('div');
  div.id = 'nueva-version-toast';
  div.style.cssText = 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:99999;background:#1d4ed8;color:#fff;padding:9px 16px;border-radius:24px;font-size:.75rem;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.5);cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap';
  div.textContent = '🔄 Nueva versión disponible — toca para actualizar';
  div.onclick = ()=> window.location.reload();
  document.body.appendChild(div);
}
const API_URL="https://script.google.com/macros/s/AKfycbwzQRnCJHFXni_9Qvs9kh_6BoikPDtb2sAMNChS3gSk9gAn5e31z5PFvKRGRzeoFqK5og/exec";
function getSesion(){ try{ return JSON.parse(localStorage.getItem('sesionActiva')||'null'); }catch(e){ return null; } }
function getToken(){ const s=getSesion(); return (s&&s.token)||''; }
let _redirigiendoLogin=false;
function sesionExpirada(){
  if(_redirigiendoLogin) return;
  _redirigiendoLogin=true;
  try{ localStorage.removeItem('sesionActiva'); }catch(e){}
  alert('Tu sesión expiró o no es válida. Ingresa de nuevo.');
  window.location.href='login.html';
}
function logout(){ if(!confirm('¿Cerrar sesión?'))return; localStorage.removeItem('sesionActiva'); window.location.href='login.html'; }

const ROLES_CARGUE=['admin','bodega','coordinador','facturador'];
const sesion=getSesion();
if(!sesion || !sesion.rol){ window.location.href='login.html'; }
else if(!ROLES_CARGUE.includes(sesion.rol)){ window.location.href='mapa_live_F150.html'; }

document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('user-name').textContent = sesion ? sesion.usuario : '—';
  document.getElementById('user-rol').textContent = sesion ? sesion.rol.toUpperCase() : '—';
  // Facturación es de solo lectura acá: los otros 2 links llevan a paneles
  // a los que no tiene acceso (rebotaría al mapa en vivo, sin utilidad para
  // este rol), así que se ocultan en vez de dejar un enlace muerto.
  if(sesion && sesion.rol==='facturador'){
    const navResumen=document.getElementById('nav-resumen-rutas');
    const navMapa=document.getElementById('nav-mapa-cargue');
    if(navResumen) navResumen.style.display='none';
    if(navMapa) navMapa.style.display='none';
  }

  initHistCarguesMapa('hist-map');
  initHistCarguesFiltro();
  buscarHistCargues();
});
</script>
<script src="cargue-utils.js"></script>
<script src="cargue-api.js"></script>
<script src="historial-cargues.js"></script>
</body>
</html>
