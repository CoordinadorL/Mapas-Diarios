<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b4f7a">
<title>OPAUSTRO — Ingreso</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;color:#0f172a;
  background:linear-gradient(135deg,#06324f 0%,#0b4f7a 45%,#0e7ab8 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
.wrap{width:100%;max-width:1040px;display:flex;align-items:center;justify-content:space-between;gap:48px}
.hero{flex:1;color:#fff;max-width:520px}
.logo-badge{background:#fff;border-radius:18px;padding:18px 26px;display:inline-block;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.logo-badge img{height:54px;display:block}
.hero h1{font-size:2.6rem;line-height:1.08;font-weight:800;margin-top:34px;letter-spacing:-.5px}
.hero p{font-size:1.02rem;color:#cfe3f1;margin-top:18px;line-height:1.55;max-width:440px}
.card{width:100%;max-width:420px;background:#fff;border-radius:22px;padding:38px 34px 34px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.card h2{font-size:1.75rem;font-weight:800;color:#0f172a}
.card .sub{font-size:.9rem;color:#64748b;margin-top:6px}
label{display:block;font-size:.88rem;font-weight:700;color:#0f172a;margin:22px 0 8px}
.campo{display:flex;align-items:center;gap:10px;border:1.5px solid #cbd5e1;border-radius:12px;padding:0 14px;height:52px;background:#fff;transition:border-color .15s,box-shadow .15s}
.campo:focus-within{border-color:#0e7ab8;box-shadow:0 0 0 3px rgba(14,122,184,.15)}
.campo .ico{font-size:1.15rem;flex-shrink:0}
.campo select,.campo input{flex:1;border:none;outline:none;font-size:1rem;font-weight:600;color:#0f172a;background:transparent;height:100%;min-width:0;font-family:inherit}
.campo select{cursor:pointer}
.ver{background:none;border:none;font-weight:800;font-size:.9rem;color:#0b4f7a;cursor:pointer;padding:6px 2px;flex-shrink:0}
.btn{width:100%;height:54px;margin-top:28px;border:none;border-radius:12px;font-size:1.05rem;font-weight:800;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,#0e7ab8,#0b4f7a);box-shadow:0 6px 18px rgba(11,79,122,.35);transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:default}
.msg{min-height:20px;margin-top:14px;font-size:.85rem;font-weight:600;color:#dc2626;text-align:center}
.msg.ok{color:#16a34a}
.reintentar{background:none;border:none;color:#0b4f7a;font-weight:800;text-decoration:underline;cursor:pointer;font-size:.85rem}
.footer{margin-top:28px;text-align:center;font-size:.72rem;font-weight:700;color:#cfe3f1;letter-spacing:.5px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:860px){
  body{justify-content:flex-start;padding-top:28px}
  .wrap{flex-direction:column;gap:24px}
  .hero{text-align:center;max-width:none}
  .logo-badge img{height:40px}
  .hero h1{font-size:1.6rem;margin-top:20px}
  .hero p{font-size:.9rem;margin:10px auto 0}
  .card{padding:28px 20px 24px}
  .card h2{font-size:1.4rem}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="logo-badge"><img src="logo-wordmark.png" alt="OPAUSTRO Logística"></div>
    <h1>Todas tus herramientas en un solo lugar</h1>
    <p>Cargues, mapas de ruta y pedidos a proveedores desde una sola plataforma.</p>
  </div>

  <form class="card" id="form-login" autocomplete="off">
    <h2>Iniciar sesión</h2>
    <div class="sub">Selecciona tu usuario e ingresa tu contraseña.</div>

    <label for="sel-usuario">Usuario</label>
    <div class="campo">
      <span class="ico">👤</span>
      <select id="sel-usuario" disabled><option value="">Cargando usuarios...</option></select>
    </div>

    <label for="inp-clave">Contraseña</label>
    <div class="campo">
      <span class="ico">🔒</span>
      <input id="inp-clave" type="password" autocomplete="current-password" placeholder="••••••">
      <button type="button" class="ver" id="btn-ver">Ver</button>
    </div>

    <button type="submit" class="btn" id="btn-ingresar">Ingresar</button>
    <div class="msg" id="msg"></div>
  </form>
</div>
<div class="footer">© OPAUSTRO-ECUADOR</div>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      setInterval(()=>reg.update().catch(()=>{}), 5*60*1000);
    }).catch(()=>{});
  });
  let controllerYaExistia = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(!controllerYaExistia){ controllerYaExistia = true; return; }
    // Solo recargar si no está escribiendo la contraseña (no perder lo tipeado).
    if(!document.getElementById('inp-clave').value) window.location.reload();
  });
}
const API_URL="https://script.google.com/macros/s/AKfycbwzQRnCJHFXni_9Qvs9kh_6BoikPDtb2sAMNChS3gSk9gAn5e31z5PFvKRGRzeoFqK5og/exec";
const DURACION_SESION_MS = 16*60*60*1000; // igual que TOKEN_TTL_MS del backend

// Si ya hay sesión activa (y no venció), ir directo al Inicio.
(function(){
  try{
    const s=JSON.parse(localStorage.getItem('sesionActiva')||'null');
    if(s && s.token && (!s.ts || Date.now()-s.ts < DURACION_SESION_MS)) window.location.replace('inicio.html');
  }catch(e){}
})();

const selUsuario=document.getElementById('sel-usuario');
const inpClave=document.getElementById('inp-clave');
const btnIngresar=document.getElementById('btn-ingresar');

function setMsg(t,cls){ const m=document.getElementById('msg'); m.textContent=t||''; m.className='msg'+(cls?(' '+cls):''); }

// JSONP: carga la respuesta con un <script>, sin CORS ni proxies de terceros.
function jsonp(qs, ms){
  ms=ms||12000;
  return new Promise((resolve,reject)=>{
    const cb='__cbl'+Date.now()+Math.floor(Math.random()*100000);
    const script=document.createElement('script');
    let done=false;
    const limpiar=()=>{ try{delete window[cb];}catch(e){window[cb]=undefined;} if(script.parentNode)script.parentNode.removeChild(script); };
    const timer=setTimeout(()=>{ if(done)return; done=true; limpiar(); reject(new Error('Tiempo agotado')); }, ms);
    window[cb]=(data)=>{ if(done)return; done=true; clearTimeout(timer); limpiar(); resolve(data); };
    script.onerror=()=>{ if(done)return; done=true; clearTimeout(timer); limpiar(); reject(new Error('Error de red')); };
    script.src=API_URL+'?'+qs+'&callback='+cb+'&t='+Date.now();
    document.head.appendChild(script);
  });
}
// Un bache breve de señal no debe dejar a nadie afuera: un reintento con pausa corta.
async function jsonpConReintento(qs){
  try{ return await jsonp(qs); }
  catch(e){ await new Promise(r=>setTimeout(r,1500)); return await jsonp(qs); }
}

async function cargarUsuarios(){
  selUsuario.disabled=true;
  selUsuario.innerHTML='<option value="">Cargando usuarios...</option>';
  setMsg('');
  let data;
  try{ data=await jsonpConReintento('tipo=usuarios'); }catch(e){ data=null; }
  if(!data || !data.ok || !Array.isArray(data.usuarios) || !data.usuarios.length){
    selUsuario.innerHTML='<option value="">No se pudo cargar</option>';
    const m=document.getElementById('msg');
    m.className='msg';
    m.textContent='❌ No se pudo cargar la lista de usuarios. ';
    const b=document.createElement('button'); b.type='button'; b.className='reintentar'; b.textContent='Reintentar';
    b.onclick=cargarUsuarios; m.appendChild(b);
    return;
  }
  selUsuario.innerHTML='';
  const ph=document.createElement('option'); ph.value=''; ph.textContent='— Selecciona tu usuario —'; selUsuario.appendChild(ph);
  data.usuarios.forEach(n=>{ const o=document.createElement('option'); o.value=n; o.textContent=n; selUsuario.appendChild(o); });
  let ultimo=''; try{ ultimo=localStorage.getItem('ultimoUsuario')||''; }catch(e){}
  if(ultimo && data.usuarios.includes(ultimo)){ selUsuario.value=ultimo; }
  selUsuario.disabled=false;
  (selUsuario.value?inpClave:selUsuario).focus();
}

document.getElementById('btn-ver').onclick=()=>{
  const oculto=inpClave.type==='password';
  inpClave.type=oculto?'text':'password';
  document.getElementById('btn-ver').textContent=oculto?'Ocultar':'Ver';
  inpClave.focus();
};

document.getElementById('form-login').addEventListener('submit', async (ev)=>{
  ev.preventDefault();
  const usuario=selUsuario.value;
  const clave=inpClave.value.trim();
  if(!usuario){ setMsg('Selecciona tu usuario.'); selUsuario.focus(); return; }
  if(!clave){ setMsg('Ingresa tu contraseña.'); inpClave.focus(); return; }
  btnIngresar.disabled=true;
  btnIngresar.innerHTML='<span class="spin"></span>Verificando...';
  setMsg('');
  let data;
  try{
    data=await jsonpConReintento('tipo=login&usuario='+encodeURIComponent(usuario)+'&pin='+encodeURIComponent(clave));
  }catch(e){
    setMsg('❌ Sin conexión. Verifica tu internet e intenta de nuevo.');
    btnIngresar.disabled=false; btnIngresar.textContent='Ingresar';
    return;
  }
  if(data && data.ok){
    try{ localStorage.setItem('ultimoUsuario', usuario); }catch(e){}
    localStorage.setItem('sesionActiva', JSON.stringify({usuario:data.usuario, rol:data.rol, token:data.token||'', ts:Date.now()}));
    setMsg('✅ Bienvenido, '+data.usuario,'ok');
    setTimeout(()=>window.location.replace('inicio.html'), 400);
  } else {
    setMsg('❌ '+((data&&data.msg)||'Contraseña incorrecta'));
    inpClave.value=''; inpClave.focus();
    btnIngresar.disabled=false; btnIngresar.textContent='Ingresar';
  }
});

cargarUsuarios();
</script>
</body>
</html>
