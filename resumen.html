<html lang="es">
<head>
<meta charset="UTF-8">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0f172a;color:#fff;min-height:100vh}
.topbar{background:linear-gradient(90deg,#1e293b,#0f172a);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #3b82f6;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:100}
.topbar h1{font-size:.95rem;font-weight:800;color:#f1f5f9}
.topbar p{font-size:.62rem;color:#64748b;margin-top:1px}
.badge{display:flex;align-items:center;gap:6px;background:#1e293b;border:1px solid #475569;border-radius:20px;padding:4px 10px;font-size:.65rem;color:#cbd5e1;cursor:pointer}
.wrap{max-width:1500px;margin:0 auto;padding:16px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;background:#131c2e;border:1px solid #1e3a5f;border-radius:12px;padding:14px;margin-bottom:16px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:.62rem;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.fselect{background:#1e293b;color:#f1f5f9;border:1.5px solid #334155;border-radius:8px;padding:7px 10px;font-size:.78rem;font-weight:600;min-width:150px;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.card{background:#131c2e;border:1px solid #1e3a5f;border-radius:12px;padding:14px}
.card .v{font-size:1.4rem;font-weight:800;color:#3b82f6}
.card .l{font-size:.62rem;color:#64748b;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.card.green .v{color:#22c55e}
.card.orange .v{color:#f97316}
.card.red .v{color:#ef4444}
.section-title{font-size:.72rem;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:20px 0 8px}
table{width:100%;border-collapse:collapse;background:#131c2e;border-radius:12px}
th{background:#1e293b;color:#94a3b8;font-size:.62rem;text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;text-align:left;position:sticky;top:47px;z-index:10}
td{padding:9px 10px;font-size:.75rem;border-top:1px solid #1e3a5f;color:#e2e8f0}
tr:hover td{background:#16213a}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.6rem;font-weight:700}
.pill.blue{background:#1d4ed8;color:#fff}
.pill.green{background:#14532d;color:#4ade80}
.pill.orange{background:#7c2d12;color:#fed7aa}
.bar-wrap{width:90px;height:6px;background:#1e293b;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}
.bar-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#22c55e)}
.btn-map{background:#1d4ed8;border:none;color:#fff;padding:5px 10px;border-radius:7px;font-size:.65rem;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn-map:hover{background:#2563eb}
.empty{text-align:center;padding:40px 20px;color:#475569;font-size:.8rem}
.detail-card{background:#131c2e;border:1px solid #1e3a5f;border-radius:14px;padding:18px;max-width:520px}
.detail-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1e293b;font-size:.8rem}
.detail-row:last-child{border-bottom:none}
.detail-row .k{color:#94a3b8}
.detail-row .v{font-weight:700}
.loading{text-align:center;padding:60px;color:#475569}
.spinner{width:34px;height:34px;border:3px solid #1e293b;border-top-color:#3b82f6;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
@media print{
  body{background:#fff}
  .topbar,.filters,.badge{display:none !important}
  .card{border:1px solid #ccc;background:#fafafa}
  .card .v{color:#111 !important}
  .card .l{color:#555}
  table{background:#fff;border:1px solid #ccc}
  th{background:#eee;color:#111}
  td{color:#111;border-color:#ddd}
  tr:hover td{background:#fff}
  td button,td input,td a.btn-map{display:none !important}
  .section-title{color:#111}
  a[href]:after{content:""}
}
</style>

<script>
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
const API_URL="https://script.google.com/macros/s/AKfycbwzQRnCJHFXni_9Qvs9kh_6BoikPDtb2sAMNChS3gSk9gAn5e31z5PFvKRGRzeoFqK5og/exec";

// ── SESIÓN ────────────────────────────────────────────────
function getSesion(){ try{ return JSON.parse(localStorage.getItem('sesionActiva')||'null'); }catch(e){ return null; } }
function getToken(){ const s=getSesion(); return (s&&s.token)||''; }
let _redirigiendoLogin=false;
function sesionExpirada(){
  if(_redirigiendoLogin) return;
  _redirigiendoLogin=true;
  try{ localStorage.removeItem('sesionActiva'); }catch(e){}
  alert('Tu sesión expiró o no es válida. Ingresa de nuevo.');
  window.location.href='login.html';
}
const ROLES_RESUMEN=['admin','bodega','coordinador','cartera'];
const sesion=getSesion();
if(!sesion || !sesion.rol){ window.location.href='login.html'; }
else if(!ROLES_RESUMEN.includes(sesion.rol)){ window.location.href='mapa_live_F150.html'; }
function logout(){ if(!confirm('¿Cerrar sesión?'))return; localStorage.removeItem('sesionActiva'); window.location.href='login.html'; }

const esCartera = sesion && sesion.rol==='cartera';

document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('user-name').textContent = sesion ? sesion.usuario : '—';
  document.getElementById('user-rol').textContent = sesion ? sesion.rol.toUpperCase() : '—';
  if(esCartera){
    // Cartera: solo ve el detalle de UNA ruta a la vez — sin filtro de bodega, sin acceso al mapa.
    document.getElementById('fg-bodega').style.display='none';
    document.getElementById('sel-camion').innerHTML='<option value="">— Selecciona un camión —</option>';
  } else {
    document.getElementById('rango-wrap').style.display='block';
    document.getElementById('titulo-detalle-dia').style.display='block';
  }
});

// ── UTILS (mismos que en el mapa) ───────────────────────────
function nk(k){return k.trim().toLowerCase().replace(/\s+/g,'_')}
function gf(row,...cs){for(const c of cs){if(row[c]!==undefined&&row[c]!=='')return row[c];const n=nk(c);for(const k of Object.keys(row))if(nk(k)===n)return row[k];}return'';}
function pn(v){if(typeof v==='number')return v;return parseFloat(String(v).replace(/[^0-9.\-]/g,''))||0;}
function ff(v){if(!v)return'';if(v instanceof Date){const y=v.getFullYear(),m=String(v.getMonth()+1).padStart(2,'0'),d=String(v.getDate()).padStart(2,'0');return`${y}-${m}-${d}`;}const s=String(v).trim();const m1=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m1)return`${m1[3]}-${m1[2].padStart(2,'0')}-${m1[1].padStart(2,'0')}`;return s.slice(0,10);}

async function fetchConTimeoutR(url, opts, ms){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(), ms);
  try{ return await fetch(url, {...opts, signal:ctrl.signal}); }
  finally{ clearTimeout(timer); }
}
// JSONP: carga la respuesta del Apps Script con un <script>, sin CORS ni proxies.
// Es la vía más confiable porque no depende de servicios de terceros.
function jsonp(qs, ms){
  ms=ms||25000;
  return new Promise((resolve,reject)=>{
    const cb='__cb'+Date.now()+Math.floor(Math.random()*100000);
    const script=document.createElement('script');
    let done=false;
    const limpiar=()=>{ try{delete window[cb];}catch(e){window[cb]=undefined;} if(script.parentNode)script.parentNode.removeChild(script); };
    const timer=setTimeout(()=>{ if(done)return; done=true; limpiar(); reject(new Error('Tiempo agotado')); }, ms);
    window[cb]=(data)=>{ if(done)return; done=true; clearTimeout(timer); limpiar();
      if(data && data.auth===false){ sesionExpirada(); reject(new Error(data.error||'Sesión expirada')); return; }
      resolve(data); };
    script.onerror=()=>{ if(done)return; done=true; clearTimeout(timer); limpiar(); reject(new Error('Error de red')); };
    script.src=API_URL+'?'+qs+'&callback='+cb+'&token='+encodeURIComponent(getToken())+'&t='+Date.now();
    document.head.appendChild(script);
  });
}
async function fetchJSON(qs){
  // Solo JSONP directo (sin proxies de terceros, que verían token y datos).
  return await jsonp(qs, 25000);
}

let MAPA_ROWS=[], AVANCE_ROWS=[], CUADRE_ROWS=[], GEO_ROWS=[];
let geoEdMap=null, geoEdMarker=null;
let FECHAS_DISPONIBLES=[];
let rangoCargado={desde:'',hasta:''}; // qué rango de fechas está actualmente en memoria

// Trae y reemplaza MAPA_ROWS/AVANCE_ROWS/CUADRE_ROWS con el rango [desde,hasta] indicado.
// Nunca se trae el historial completo — así el sistema no se vuelve lento aunque el Sheet crezca.
async function cargarRango(desde,hasta){
  const [mapa,avance,cuadre]=await Promise.all([
    fetchJSON(`tipo=mapa&desde=${encodeURIComponent(desde)}&hasta=${encodeURIComponent(hasta)}`),
    fetchJSON(`tipo=resumen&desde=${encodeURIComponent(desde)}&hasta=${encodeURIComponent(hasta)}`),
    fetchJSON(`tipo=cuadre&desde=${encodeURIComponent(desde)}&hasta=${encodeURIComponent(hasta)}`)
  ]);
  MAPA_ROWS=(mapa||[]).map(row=>({
    fecha:ff(gf(row,'Fecha Liq','fecha_liq','fecha')),
    chofer:String(gf(row,'Chofer','chofer')).trim(),
    codigo:String(gf(row,'CodigoCliente','Codigo Cliente','codigo_cliente')),
    razon:String(gf(row,'Razon','razon','Razón')).trim(),
    dir:String(gf(row,'Direccion','direccion','Dirección')).trim(),
    total:pn(gf(row,'Suma de Total','Suma Total','total','Total')),
    peso:pn(gf(row,'Suma de Peso','peso','Peso')),
  })).filter(r=>r.fecha&&r.chofer);
  AVANCE_ROWS=(avance||[]).map(row=>({
    ts:String(row['Timestamp']||''),
    fecha:String(row['Fecha']||''),
    chofer:String(row['Chofer']||'').trim(),
    codigo:String(row['CodigoCliente']||''),
    estado:String(row['Estado']||'').toUpperCase(),
    monto:pn(row['Monto']),
    motivo:row['Motivo']||'',
    bodega:String(row['Bodega']||'').toLowerCase().trim(),
    metodoPago:String(row['MetodoPago']||'').toUpperCase().trim(),
  }));
  CUADRE_ROWS=(cuadre||[]).map(row=>({
    ts:String(row['Timestamp']||''),
    fecha:String(row['Fecha']||''),
    chofer:String(row['Chofer']||'').trim(),
    bodega:String(row['Bodega']||'').toLowerCase().trim(),
    montoDeclarado:pn(row['MontoDeclarado']),
    montoSistema:pn(row['MontoSistema']),
    observaciones:row['Observaciones']||'',
    fotos:String(row['FotosURLs']||'').split(' | ').filter(Boolean),
    estado:String(row['Estado']||'PENDIENTE').toUpperCase(),
    usuario:row['Usuario']||'',
    notaCartera:row['NotaCartera']||'',
  }));
  rangoCargado={desde,hasta};
}
// Asegura que [desde,hasta] esté cubierto por lo ya cargado; si no, amplía la carga.
async function asegurarRango(desde,hasta){
  if(rangoCargado.desde && rangoCargado.hasta && desde>=rangoCargado.desde && hasta<=rangoCargado.hasta) return;
  const nDesde = (!rangoCargado.desde || desde<rangoCargado.desde) ? desde : rangoCargado.desde;
  const nHasta = (!rangoCargado.hasta || hasta>rangoCargado.hasta) ? hasta : rangoCargado.hasta;
  await cargarRango(nDesde,nHasta);
}

async function cargarTodo(){
  try{
    FECHAS_DISPONIBLES=await fetchJSON('tipo=fechas');
    buildFiltroFecha();
    const fechaInicial=document.getElementById('sel-fecha').value;
    const idx7=Math.max(0,FECHAS_DISPONIBLES.length-7);
    const desdeDefault=FECHAS_DISPONIBLES[idx7]||fechaInicial||'';
    const hastaDefault=FECHAS_DISPONIBLES[FECHAS_DISPONIBLES.length-1]||fechaInicial||'';
    const desde=(fechaInicial && fechaInicial<desdeDefault)?fechaInicial:desdeDefault;
    const hasta=(fechaInicial && fechaInicial>hastaDefault)?fechaInicial:hastaDefault;
    await cargarRango(desde||fechaInicial,hasta||fechaInicial);
    await cargarGeo();
    document.getElementById('loading').style.display='none';
    document.getElementById('contenido').style.display='block';
    if(!esCartera) setRangoRapido(7);
    render();
  }catch(err){
    document.getElementById('loading').innerHTML=`<div style="color:#f87171">❌ No se pudo cargar el Sheet.<br>${err.message}</div>`;
  }
}
function cuadreDe(fecha,chofer){
  const rows=CUADRE_ROWS.filter(r=>r.fecha===fecha&&r.chofer===chofer);
  return rows.length ? rows[rows.length-1] : null;
}
async function marcarCuadre(fecha,chofer,estado){
  const notaInput=document.getElementById('nota-cartera-'+chofer.replace(/[^a-zA-Z0-9]/g,'_'));
  const notaCartera=notaInput?notaInput.value.trim():'';
  try{
    await fetchConTimeoutR(API_URL,{
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({tipo:'cuadre_revision',token:getToken(),fecha,chofer,estado,notaCartera})
    },25000);
  }catch(e){ /* no-cors: no podemos leer respuesta, seguimos igual */ }
  const row=CUADRE_ROWS.find(r=>r.fecha===fecha&&r.chofer===chofer);
  if(row){ row.estado=estado; row.notaCartera=notaCartera; }
  render();
}

function buildFiltroFecha(){
  const fechas=[...FECHAS_DISPONIBLES].sort().reverse();
  const sel=document.getElementById('sel-fecha');
  sel.innerHTML=fechas.map(f=>`<option value="${f}">${f}</option>`).join('');
  if(fechas.length) sel.value=fechas[0]; // más reciente por defecto
}

// Para cada chofer+fecha, calcula la bodega usada (la más reciente marcada en AVANCE)
function bodegaDe(fecha,chofer){
  const rows=AVANCE_ROWS.filter(r=>r.fecha===fecha&&r.chofer===chofer&&r.bodega).sort((a,b)=>a.ts.localeCompare(b.ts));
  return rows.length ? rows[rows.length-1].bodega : '';
}

function resumenCamion(fecha,chofer){
  const pedidos=MAPA_ROWS.filter(r=>r.fecha===fecha&&r.chofer===chofer);
  const totalPedidos=pedidos.length;
  const totalMonto=pedidos.reduce((s,r)=>s+r.total,0);
  const totalPeso=pedidos.reduce((s,r)=>s+r.peso,0);
  // último estado por código de cliente (por si hay filas viejas duplicadas)
  const porCodigo=new Map();
  AVANCE_ROWS.filter(r=>r.fecha===fecha&&r.chofer===chofer).forEach(r=>{
    const prev=porCodigo.get(r.codigo);
    if(!prev||r.ts>prev.ts) porCodigo.set(r.codigo,r);
  });
  let entregados=0,recaudado=0,ncVal=0,ncN=0,porCobrarN=0,porCobrarVal=0,quemadosN=0,quemadoVal=0,anuladosN=0,anulVal=0;
  const met={EFECTIVO:0,TRANSFERENCIA:0,CHEQUE:0,CREDITO:0};
  porCodigo.forEach(r=>{
    const pedido=pedidos.find(p=>p.codigo===r.codigo);
    const total=pedido?pedido.total:r.monto;
    const m=(r.metodoPago && met[r.metodoPago]!==undefined)?r.metodoPago:'EFECTIVO';
    if(r.estado==='ENTREGADO'||r.estado==='ENTREGADO_PARCIAL'){
      entregados++; recaudado+=r.monto; met[m]+=r.monto;
      const nc=Math.max(0,total-r.monto); if(nc>0.009){ ncVal+=nc; ncN++; }
    }
    else if(r.estado==='QUEMADO'){
      // Quemado de NC: lo quemado es dinero recaudado (cuenta en Entregados); la diferencia es NC.
      entregados++; recaudado+=r.monto; met[m]+=r.monto; quemadosN++; quemadoVal+=r.monto;
      const nc=Math.max(0,total-r.monto); if(nc>0.009){ ncVal+=nc; ncN++; }
    }
    else if(r.estado==='POR_COBRAR'){ porCobrarN++; porCobrarVal+=total; }
    else if(r.estado==='ANULADO'){ anuladosN++; anulVal+=total; }
  });
  const pendientes=Math.max(0,totalPedidos-entregados-porCobrarN-anuladosN);
  const pct=totalPedidos?Math.round((entregados+anuladosN+porCobrarN)/totalPedidos*100):0; // % de ruta "resuelta"
  return {chofer,fecha,bodega:bodegaDe(fecha,chofer),totalPedidos,totalMonto,totalPeso,
    entregados,recaudado,
    efectivo:met.EFECTIVO,transferencia:met.TRANSFERENCIA,cheque:met.CHEQUE,credito:met.CREDITO,aDepositar:met.EFECTIVO,
    ncVal,ncN,porCobrarN,porCobrarVal,quemadosN,quemadoVal,anuladosN,anulVal,pendientes,pct};
}

async function renderRango(){
  const wrap=document.getElementById('rango-resumen');
  const desde=document.getElementById('rango-desde').value;
  const hasta=document.getElementById('rango-hasta').value;
  if(!desde||!hasta){ wrap.innerHTML=''; return; }
  if(desde<rangoCargado.desde || hasta>rangoCargado.hasta){
    wrap.innerHTML=`<div class="loading" style="padding:30px"><div class="spinner"></div>Cargando rango...</div>`;
    try{ await asegurarRango(desde,hasta); }
    catch(err){ wrap.innerHTML=`<div style="color:#f87171;padding:20px">❌ ${err.message}</div>`; return; }
  }
  const fechasEnRango=[...FECHAS_DISPONIBLES].filter(f=>f>=desde&&f<=hasta).sort();

  let totRecaudado=0, totEfectivo=0, totPedidos=0, totAnulados=0, totNC=0, totMonto=0;
  const porCamionAcum={};
  let filaDias='';

  fechasEnRango.forEach(f=>{
    const choferesDia=[...new Set(MAPA_ROWS.filter(r=>r.fecha===f).map(r=>r.chofer))];
    let recD=0,efeD=0,pedD=0,anulD=0,ncD=0,montoD=0;
    choferesDia.forEach(c=>{
      const r=resumenCamion(f,c);
      recD+=r.recaudado; efeD+=r.efectivo; pedD+=r.totalPedidos; anulD+=r.anuladosN; ncD+=r.ncVal; montoD+=r.totalMonto;
      if(!porCamionAcum[c]) porCamionAcum[c]={pedidos:0,recaudado:0,efectivo:0,anulados:0,nc:0,total:0,dias:0};
      porCamionAcum[c].pedidos+=r.totalPedidos;
      porCamionAcum[c].recaudado+=r.recaudado;
      porCamionAcum[c].efectivo+=r.efectivo;
      porCamionAcum[c].anulados+=r.anuladosN;
      porCamionAcum[c].nc+=r.ncVal;
      porCamionAcum[c].total+=r.totalMonto;
      porCamionAcum[c].dias+=1;
    });
    totRecaudado+=recD; totEfectivo+=efeD; totPedidos+=pedD; totAnulados+=anulD; totNC+=ncD; totMonto+=montoD;
    filaDias+=`<tr><td>${f}</td><td>${choferesDia.length}</td><td>${pedD}</td><td style="color:#4ade80;font-weight:700">$${recD.toFixed(2)}</td><td style="color:#4ade80;font-weight:800">$${efeD.toFixed(2)}</td><td>${anulD}</td><td style="color:${ncD>0.009?'#f87171':'#64748b'}">$${ncD.toFixed(2)}</td></tr>`;
  });

  let filasCamion='';
  Object.keys(porCamionAcum).sort().forEach(c=>{
    const a=porCamionAcum[c];
    filasCamion+=`<tr><td><b>${c}</b></td><td>${a.dias}</td><td>${a.pedidos}</td><td>$${a.total.toFixed(2)}</td><td style="color:#4ade80;font-weight:700">$${a.recaudado.toFixed(2)}</td><td style="color:#4ade80;font-weight:800">$${a.efectivo.toFixed(2)}</td><td>${a.anulados}</td><td style="color:${a.nc>0.009?'#f87171':'#64748b'}">$${a.nc.toFixed(2)}</td></tr>`;
  });

  wrap.innerHTML=`
    <div class="section-title">📅 Resumen del ${desde} al ${hasta} (${fechasEnRango.length} día${fechasEnRango.length===1?'':'s'} con rutas)</div>
    <div class="cards">
      <div class="card"><div class="v">${totPedidos}</div><div class="l">Pedidos totales</div></div>
      <div class="card"><div class="v">$${totMonto.toFixed(0)}</div><div class="l">Facturado</div></div>
      <div class="card green"><div class="v">$${totRecaudado.toFixed(0)}</div><div class="l">Recaudado</div></div>
      <div class="card green"><div class="v">$${totEfectivo.toFixed(0)}</div><div class="l">💵 Efectivo</div></div>
      <div class="card red"><div class="v">$${totNC.toFixed(0)}</div><div class="l">NC (no cobrado)</div></div>
      <div class="card orange"><div class="v">${totAnulados}</div><div class="l">Anulados</div></div>
    </div>
    <div class="section-title">📈 Por día</div>
    <table><thead><tr><th>Fecha</th><th>Camiones</th><th>Pedidos</th><th>Recaudado</th><th>💵 Efectivo</th><th>Anulados</th><th>NC</th></tr></thead>
    <tbody>${filaDias||'<tr><td colspan="7" style="text-align:center;color:#475569;padding:16px">Sin rutas en este rango</td></tr>'}</tbody></table>
    <div class="section-title">🚛 Por camión (acumulado del rango)</div>
    <table><thead><tr><th>Camión</th><th>Días activo</th><th>Pedidos</th><th>$ Total</th><th>$ Recaudado</th><th>💵 Efectivo</th><th>Anulados</th><th>NC</th></tr></thead>
    <tbody>${filasCamion||'<tr><td colspan="8" style="text-align:center;color:#475569;padding:16px">Sin datos</td></tr>'}</tbody></table>`;
}

cargarTodo();

// ══════════════════════════════════════════════════════════
// UBICACIONES CORREGIDAS (solo admin/bodega/coordinador)
// ══════════════════════════════════════════════════════════
async function cargarGeo(){
  try{ const r=await fetchJSON('tipo=geo'); GEO_ROWS=Array.isArray(r)?r:[]; }catch(e){ GEO_ROWS=[]; }
}
function geoLatestPorCodigo(){
  const m={};
  [...GEO_ROWS].sort((a,b)=>String(a.Timestamp||'').localeCompare(String(b.Timestamp||''))).forEach(r=>{
    const c=String(r.CodigoCliente||'').trim(); if(!c) return;
    m[c]={codigo:c, lat:parseFloat(r.Latitud), lng:parseFloat(r.Longitud), usuario:r.Usuario||'', ts:String(r.Timestamp||'')};
  });
  return Object.values(m).sort((a,b)=>b.ts.localeCompare(a.ts));
}
function infoCliente(cod){
  const r=MAPA_ROWS.find(x=>x.codigo===String(cod));
  return { razon:(r&&r.razon)||'', dir:(r&&r.dir)||'' };
}
function geoEdInfo(){
  const cod=document.getElementById('geo-ed-cod').value.trim();
  const info=infoCliente(cod);
  const el=document.getElementById('geo-ed-info');
  if(el) el.innerHTML = (info.razon||info.dir) ? ('👤 <b>'+(info.razon||'—')+'</b><br>📍 '+(info.dir||'—')) : '<span style="color:#64748b">Cliente no encontrado en las rutas cargadas.</span>';
}
function renderGeoPanel(){
  const lista=geoLatestPorCodigo();
  const filas = lista.length ? lista.map(g=>{
    const info=infoCliente(g.codigo);
    return `<tr>
    <td style="max-width:190px;white-space:normal;word-break:break-word"><b>${g.codigo}</b>${info.razon?`<br><span style="font-size:.72rem;color:#cbd5e1">${info.razon}</span>`:''}</td>
    <td style="max-width:230px;white-space:normal;word-break:break-word;font-size:.72rem;color:#94a3b8">${info.dir||'—'}</td>
    <td style="white-space:nowrap">${isNaN(g.lat)?'—':g.lat.toFixed(6)}, ${isNaN(g.lng)?'—':g.lng.toFixed(6)}</td>
    <td>${g.usuario||'—'}</td>
    <td style="font-size:.72rem;color:#94a3b8">${g.ts||'—'}</td>
    <td style="white-space:nowrap">
      <button onclick="abrirGeoEditor('${g.codigo}',${g.lat},${g.lng})" style="background:#1d4ed8;color:#fff;border:none;border-radius:6px;padding:4px 9px;font-size:.62rem;font-weight:700;cursor:pointer;margin-right:4px">✏️ Corregir</button>
      <button onclick="revertirGeo('${g.codigo}')" style="background:#7f1d1d;color:#fca5a5;border:none;border-radius:6px;padding:4px 9px;font-size:.62rem;font-weight:700;cursor:pointer">↩ Revertir</button>
    </td></tr>`;
  }).join('') : '<tr><td colspan="6" style="text-align:center;color:#475569;padding:16px">Sin ubicaciones corregidas todavía.</td></tr>';
  return `
    <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <span>📍 Ubicaciones corregidas de clientes</span>
      <button onclick="abrirGeoEditor('',null,null)" style="background:#15803d;color:#fff;border:none;border-radius:8px;padding:6px 11px;font-size:.7rem;font-weight:700;cursor:pointer">➕ Nueva corrección</button>
    </div>
    <table><thead><tr><th>Cliente</th><th>Dirección</th><th>Coordenadas (lat, lng)</th><th>Corregido por</th><th>Fecha</th><th>Acciones</th></tr></thead>
    <tbody>${filas}</tbody></table>`;
}
function abrirGeoEditor(cod, lat, lng){
  document.getElementById('geo-editor-overlay').style.display='flex';
  const codInput=document.getElementById('geo-ed-cod');
  codInput.value=cod||''; codInput.readOnly=!!cod;
  geoEdInfo();
  document.getElementById('geo-ed-msg').textContent='';
  const la=(lat!=null && !isNaN(lat))?Number(lat):-1.66414;
  const lo=(lng!=null && !isNaN(lng))?Number(lng):-78.65467;
  document.getElementById('geo-ed-lat').value=la.toFixed(6);
  document.getElementById('geo-ed-lng').value=lo.toFixed(6);
  const pinRadio=document.querySelector('input[name="geo-metodo"][value="pin"]'); if(pinRadio) pinRadio.checked=true;
  setTimeout(()=>{
    if(!geoEdMap){
      geoEdMap=L.map('geo-ed-map').setView([la,lo],16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(geoEdMap);
      geoEdMarker=L.marker([la,lo],{draggable:true}).addTo(geoEdMap);
      geoEdMarker.on('dragend',()=>{ const p=geoEdMarker.getLatLng(); document.getElementById('geo-ed-lat').value=p.lat.toFixed(6); document.getElementById('geo-ed-lng').value=p.lng.toFixed(6); });
    } else {
      geoEdMap.setView([la,lo],16); geoEdMarker.setLatLng([la,lo]);
    }
    geoEdMap.invalidateSize();
    geoEdModo();
  },150);
}
function geoEdModo(){
  const pin=document.querySelector('input[name="geo-metodo"]:checked').value==='pin';
  document.getElementById('geo-ed-lat').readOnly=pin;
  document.getElementById('geo-ed-lng').readOnly=pin;
  if(geoEdMarker && geoEdMarker.dragging){ pin?geoEdMarker.dragging.enable():geoEdMarker.dragging.disable(); }
}
function geoEdInput(){
  const la=parseFloat(document.getElementById('geo-ed-lat').value), lo=parseFloat(document.getElementById('geo-ed-lng').value);
  if(!isNaN(la)&&!isNaN(lo)&&geoEdMap&&geoEdMarker){ geoEdMarker.setLatLng([la,lo]); geoEdMap.panTo([la,lo]); }
}
function cerrarGeoEditor(){ document.getElementById('geo-editor-overlay').style.display='none'; }
async function guardarGeoEditor(){
  const cod=document.getElementById('geo-ed-cod').value.trim();
  const la=parseFloat(document.getElementById('geo-ed-lat').value), lo=parseFloat(document.getElementById('geo-ed-lng').value);
  const msg=document.getElementById('geo-ed-msg');
  if(!cod){ msg.style.color='#f87171'; msg.textContent='Ingresa el código del cliente.'; return; }
  if(isNaN(la)||isNaN(lo)){ msg.style.color='#f87171'; msg.textContent='Coordenadas inválidas.'; return; }
  msg.style.color='#93c5fd'; msg.textContent='Guardando...';
  const sesion=getSesion();
  try{
    await fetchConTimeoutR(API_URL,{ method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({ tipo:'geo', token:getToken(), codigoCliente:cod, lat:la, lng:lo, usuario:(sesion&&sesion.usuario)||'' }) }, 20000);
  }catch(e){}
  msg.style.color='#4ade80'; msg.textContent='✅ Guardado';
  await cargarGeo();
  setTimeout(()=>{ cerrarGeoEditor(); render(); }, 700);
}
async function revertirGeo(cod){
  if(!confirm('¿Revertir la última corrección de ubicación del cliente '+cod+'?\n\nVolverá a la corrección anterior (o a la ubicación original de MAPA 1 si no queda ninguna).')) return;
  try{
    await fetchConTimeoutR(API_URL,{ method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({ tipo:'geo_revertir', token:getToken(), codigoCliente:cod }) }, 20000);
  }catch(e){}
  await cargarGeo();
  render();
}

// Barra apilada de 4 colores: verde (v), naranja (n), rojo (r), gris (resto).
function barra4(v,n,r,total){
  const t=total>0?total:1;
  const pv=Math.max(0,v)/t*100, pn=Math.max(0,n)/t*100, pr=Math.max(0,r)/t*100;
  const pg=Math.max(0,100-pv-pn-pr);
  return `<span style="display:inline-flex;width:110px;height:9px;border-radius:5px;overflow:hidden;background:#334155;vertical-align:middle;margin-right:6px">`
    +`<span style="width:${pv}%;background:#22c55e"></span>`
    +`<span style="width:${pn}%;background:#f97316"></span>`
    +`<span style="width:${pr}%;background:#ef4444"></span>`
    +`<span style="width:${pg}%;background:#475569"></span></span>`;
}
// Selector de fecha por calendario
function syncFechaCal(){ const s=document.getElementById('sel-fecha'), c=document.getElementById('fecha-cal'); if(s&&c) c.value=s.value; }
async function onFechaCal(){
  const d=document.getElementById('fecha-cal').value; if(!d) return;
  try{ await asegurarRango(d,d); }catch(e){}
  const sel=document.getElementById('sel-fecha');
  if(![...sel.options].some(o=>o.value===d)){ const o=document.createElement('option'); o.value=d; o.textContent=d; sel.appendChild(o); }
  sel.value=d;
  render();
}

// ── EXPORTAR ─────────────────────────────────────────────
function exportarExcel(){
  const tablas=document.querySelectorAll('#contenido table');
  if(!tablas.length){ alert('No hay datos para exportar todavía.'); return; }
  const wb=XLSX.utils.book_new();
  tablas.forEach((t,i)=>{
    const ws=XLSX.utils.table_to_sheet(t);
    const nombre=i===0?'Resumen':'Cuadres_'+i;
    XLSX.utils.book_append_sheet(wb, ws, nombre.substring(0,31));
  });
  const fecha=document.getElementById('sel-fecha').value||'reporte';
  XLSX.writeFile(wb, `Resumen_Mapas_${fecha}.xlsx`);
}
function exportarPDF(){
  window.print();
}
