<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Mapas Diarios — Resumen</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0f172a;color:#fff;min-height:100vh}
.topbar{background:linear-gradient(90deg,#1e293b,#0f172a);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #3b82f6;flex-wrap:wrap;gap:8px}
.topbar h1{font-size:.95rem;font-weight:800;color:#f1f5f9}
.topbar p{font-size:.62rem;color:#64748b;margin-top:1px}
.badge{display:flex;align-items:center;gap:6px;background:#1e293b;border:1px solid #475569;border-radius:20px;padding:4px 10px;font-size:.65rem;color:#cbd5e1;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;background:#131c2e;border:1px solid #1e3a5f;border-radius:12px;padding:14px;margin-bottom:16px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:.62rem;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.fselect{background:#1e293b;color:#f1f5f9;border:1.5px solid #334155;border-radius:8px;padding:7px 10px;font-size:.78rem;font-weight:600;min-width:150px;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.card{background:#131c2e;border:1px solid #1e3a5f;border-radius:12px;padding:14px}
.card .v{font-size:1.4rem;font-weight:800;color:#3b82f6}
.card .l{font-size:.62rem;color:#64748b;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.card.green .v{color:#22c55e}
.card.orange .v{color:#f97316}
.card.red .v{color:#ef4444}
.section-title{font-size:.72rem;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:20px 0 8px}
table{width:100%;border-collapse:collapse;background:#131c2e;border-radius:12px;overflow:hidden}
th{background:#1e293b;color:#94a3b8;font-size:.62rem;text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;text-align:left}
td{padding:9px 10px;font-size:.75rem;border-top:1px solid #1e3a5f;color:#e2e8f0}
tr:hover td{background:#16213a}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.6rem;font-weight:700}
.pill.blue{background:#1d4ed8;color:#fff}
.pill.green{background:#14532d;color:#4ade80}
.pill.orange{background:#7c2d12;color:#fed7aa}
.bar-wrap{width:90px;height:6px;background:#1e293b;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}
.bar-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#22c55e)}
.btn-map{background:#1d4ed8;border:none;color:#fff;padding:5px 10px;border-radius:7px;font-size:.65rem;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn-map:hover{background:#2563eb}
.empty{text-align:center;padding:40px 20px;color:#475569;font-size:.8rem}
.detail-card{background:#131c2e;border:1px solid #1e3a5f;border-radius:14px;padding:18px;max-width:520px}
.detail-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1e293b;font-size:.8rem}
.detail-row:last-child{border-bottom:none}
.detail-row .k{color:#94a3b8}
.detail-row .v{font-weight:700}
.loading{text-align:center;padding:60px;color:#475569}
.spinner{width:34px;height:34px;border:3px solid #1e293b;border-top-color:#3b82f6;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
@media print{
  body{background:#fff}
  .topbar,.filters,.badge{display:none !important}
  .card{border:1px solid #ccc;background:#fafafa}
  .card .v{color:#111 !important}
  .card .l{color:#555}
  table{background:#fff;border:1px solid #ccc}
  th{background:#eee;color:#111}
  td{color:#111;border-color:#ddd}
  tr:hover td{background:#fff}
  td button,td input,td a.btn-map{display:none !important}
  .section-title{color:#111}
  a[href]:after{content:""}
}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>📊 MAPAS DIARIOS — RESUMEN</h1>
    <p id="sub-info">Cargando...</p>
  </div>
  <div class="badge" onclick="logout()" title="Cerrar sesión">👤 <span id="user-name">—</span> · <span id="user-rol">—</span> ⏻</div>
</div>

<div class="wrap">

  <div class="filters" id="filters">
    <div class="fg">
      <label>📅 Fecha</label>
      <select class="fselect" id="sel-fecha" onchange="render()"><option>Cargando...</option></select>
    </div>
    <div class="fg" id="fg-camion">
      <label>🚛 Camión</label>
      <select class="fselect" id="sel-camion" onchange="render()"><option value="">Todos</option></select>
    </div>
    <div class="fg" id="fg-bodega">
      <label>🏭 Bodega</label>
      <select class="fselect" id="sel-bodega-f" onchange="render()">
        <option value="">Todas</option>
        <option value="riobamba">Riobamba</option>
        <option value="ambato">Ambato</option>
      </select>
    </div>
    <a class="btn-map" id="btn-ir-mapa" href="mapa_live_F150.html" style="display:none">🗺️ Abrir mapa</a>
    <button class="btn-map" style="background:#15803d;margin-left:auto" onclick="exportarExcel()">📥 Excel</button>
    <button class="btn-map" style="background:#334155" onclick="exportarPDF()">🖨️ PDF</button>
  </div>

  <div id="loading" class="loading"><div class="spinner"></div>Cargando datos del Sheet...</div>

  <div id="rango-wrap" style="display:none">
    <div class="filters" style="margin-bottom:10px">
      <div class="fg">
        <label>📅 Desde</label>
        <input type="date" class="fselect" id="rango-desde" onchange="renderRango()">
      </div>
      <div class="fg">
        <label>📅 Hasta</label>
        <input type="date" class="fselect" id="rango-hasta" onchange="renderRango()">
      </div>
      <div class="fg" style="justify-content:flex-end">
        <label>&nbsp;</label>
        <div style="display:flex;gap:6px">
          <button class="btn-map" style="background:#334155" onclick="setRangoRapido(7)">Últimos 7 días</button>
          <button class="btn-map" style="background:#334155" onclick="setRangoRapido(30)">Últimos 30 días</button>
        </div>
      </div>
    </div>
    <div id="rango-resumen"></div>
  </div>

  <div class="section-title" id="titulo-detalle-dia" style="display:none">📌 Detalle del día seleccionado</div>
  <div id="contenido" style="display:none"></div>

</div>

<script>
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
const API_URL="https://script.google.com/macros/s/AKfycbwzQRnCJHFXni_9Qvs9kh_6BoikPDtb2sAMNChS3gSk9gAn5e31z5PFvKRGRzeoFqK5og/exec";

// ── SESIÓN ────────────────────────────────────────────────
function getSesion(){ try{ return JSON.parse(localStorage.getItem('sesionActiva')||'null'); }catch(e){ return null; } }
const ROLES_RESUMEN=['admin','bodega','coordinador','cartera'];
const sesion=getSesion();
if(!sesion || !sesion.rol){ window.location.href='login.html'; }
else if(!ROLES_RESUMEN.includes(sesion.rol)){ window.location.href='mapa_live_F150.html'; }
function logout(){ if(!confirm('¿Cerrar sesión?'))return; localStorage.removeItem('sesionActiva'); window.location.href='login.html'; }

const esCartera = sesion && sesion.rol==='cartera';

document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('user-name').textContent = sesion ? sesion.usuario : '—';
  document.getElementById('user-rol').textContent = sesion ? sesion.rol.toUpperCase() : '—';
  if(esCartera){
    // Cartera: solo ve el detalle de UNA ruta a la vez — sin filtro de bodega, sin acceso al mapa.
    document.getElementById('fg-bodega').style.display='none';
    document.getElementById('sel-camion').innerHTML='<option value="">— Selecciona un camión —</option>';
  } else {
    document.getElementById('rango-wrap').style.display='block';
    document.getElementById('titulo-detalle-dia').style.display='block';
  }
});

// ── UTILS (mismos que en el mapa) ───────────────────────────
function nk(k){return k.trim().toLowerCase().replace(/\s+/g,'_')}
function gf(row,...cs){for(const c of cs){if(row[c]!==undefined&&row[c]!=='')return row[c];const n=nk(c);for(const k of Object.keys(row))if(nk(k)===n)return row[k];}return'';}
function pn(v){if(typeof v==='number')return v;return parseFloat(String(v).replace(/[^0-9.\-]/g,''))||0;}
function ff(v){if(!v)return'';if(v instanceof Date){const y=v.getFullYear(),m=String(v.getMonth()+1).padStart(2,'0'),d=String(v.getDate()).padStart(2,'0');return`${y}-${m}-${d}`;}const s=String(v).trim();const m1=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m1)return`${m1[3]}-${m1[2].padStart(2,'0')}-${m1[1].padStart(2,'0')}`;return s.slice(0,10);}

async function fetchConTimeoutR(url, opts, ms){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(), ms);
  try{ return await fetch(url, {...opts, signal:ctrl.signal}); }
  finally{ clearTimeout(timer); }
}
async function fetchJSON(qs){
  const target=API_URL+'?'+qs+'&t='+Date.now();
  const intentos=[
    async()=>{
      const res=await fetchConTimeoutR(target,{method:'GET',mode:'cors'},25000);
      if(!res.ok)throw new Error('HTTP '+res.status);
      return await res.json();
    },
    async()=>{
      const P='https://api.allorigins.win/get?url='+encodeURIComponent(target);
      const res=await fetchConTimeoutR(P,{},25000);
      if(!res.ok)throw new Error('HTTP '+res.status);
      const w=await res.json();
      return JSON.parse(w.contents);
    },
    async()=>{
      const P='https://corsproxy.io/?url='+encodeURIComponent(target);
      const res=await fetchConTimeoutR(P,{},25000);
      if(!res.ok)throw new Error('HTTP '+res.status);
      return await res.json();
    }
  ];
  let ultimoError=null;
  for(const intento of intentos){
    try{ return await intento(); }
    catch(e){ ultimoError=e; }
  }
  throw new Error('Sin conexión con el Sheet.');
}

let MAPA_ROWS=[], AVANCE_ROWS=[], CUADRE_ROWS=[];
let FECHAS_DISPONIBLES=[];
let rangoCargado={desde:'',hasta:''}; // qué rango de fechas está actualmente en memoria

// Trae y reemplaza MAPA_ROWS/AVANCE_ROWS/CUADRE_ROWS con el rango [desde,hasta] indicado.
// Nunca se trae el historial completo — así el sistema no se vuelve lento aunque el Sheet crezca.
async function cargarRango(desde,hasta){
  const [mapa,avance,cuadre]=await Promise.all([
    fetchJSON(`tipo=mapa&desde=${encodeURIComponent(desde)}&hasta=${encodeURIComponent(hasta)}`),
    fetchJSON(`tipo=resumen&desde=${encodeURIComponent(desde)}&hasta=${encodeURIComponent(hasta)}`),
    fetchJSON(`tipo=cuadre&desde=${encodeURIComponent(desde)}&hasta=${encodeURIComponent(hasta)}`)
  ]);
  MAPA_ROWS=(mapa||[]).map(row=>({
    fecha:ff(gf(row,'Fecha Liq','fecha_liq','fecha')),
    chofer:String(gf(row,'Chofer','chofer')).trim(),
    codigo:String(gf(row,'CodigoCliente','Codigo Cliente','codigo_cliente')),
    total:pn(gf(row,'Suma de Total','Suma Total','total','Total')),
    peso:pn(gf(row,'Suma de Peso','peso','Peso')),
  })).filter(r=>r.fecha&&r.chofer);
  AVANCE_ROWS=(avance||[]).map(row=>({
    ts:String(row['Timestamp']||''),
    fecha:String(row['Fecha']||''),
    chofer:String(row['Chofer']||'').trim(),
    codigo:String(row['CodigoCliente']||''),
    estado:String(row['Estado']||'').toUpperCase(),
    monto:pn(row['Monto']),
    motivo:row['Motivo']||'',
    bodega:String(row['Bodega']||'').toLowerCase().trim(),
  }));
  CUADRE_ROWS=(cuadre||[]).map(row=>({
    ts:String(row['Timestamp']||''),
    fecha:String(row['Fecha']||''),
    chofer:String(row['Chofer']||'').trim(),
    bodega:String(row['Bodega']||'').toLowerCase().trim(),
    montoDeclarado:pn(row['MontoDeclarado']),
    montoSistema:pn(row['MontoSistema']),
    observaciones:row['Observaciones']||'',
    fotos:String(row['FotosURLs']||'').split(' | ').filter(Boolean),
    estado:String(row['Estado']||'PENDIENTE').toUpperCase(),
    usuario:row['Usuario']||'',
    notaCartera:row['NotaCartera']||'',
  }));
  rangoCargado={desde,hasta};
}
// Asegura que [desde,hasta] esté cubierto por lo ya cargado; si no, amplía la carga.
async function asegurarRango(desde,hasta){
  if(rangoCargado.desde && rangoCargado.hasta && desde>=rangoCargado.desde && hasta<=rangoCargado.hasta) return;
  const nDesde = (!rangoCargado.desde || desde<rangoCargado.desde) ? desde : rangoCargado.desde;
  const nHasta = (!rangoCargado.hasta || hasta>rangoCargado.hasta) ? hasta : rangoCargado.hasta;
  await cargarRango(nDesde,nHasta);
}

async function cargarTodo(){
  try{
    FECHAS_DISPONIBLES=await fetchJSON('tipo=fechas');
    buildFiltroFecha();
    const fechaInicial=document.getElementById('sel-fecha').value;
    const idx7=Math.max(0,FECHAS_DISPONIBLES.length-7);
    const desdeDefault=FECHAS_DISPONIBLES[idx7]||fechaInicial||'';
    const hastaDefault=FECHAS_DISPONIBLES[FECHAS_DISPONIBLES.length-1]||fechaInicial||'';
    const desde=(fechaInicial && fechaInicial<desdeDefault)?fechaInicial:desdeDefault;
    const hasta=(fechaInicial && fechaInicial>hastaDefault)?fechaInicial:hastaDefault;
    await cargarRango(desde||fechaInicial,hasta||fechaInicial);
    document.getElementById('loading').style.display='none';
    document.getElementById('contenido').style.display='block';
    if(!esCartera) setRangoRapido(7);
    render();
  }catch(err){
    document.getElementById('loading').innerHTML=`<div style="color:#f87171">❌ No se pudo cargar el Sheet.<br>${err.message}</div>`;
  }
}
function cuadreDe(fecha,chofer){
  const rows=CUADRE_ROWS.filter(r=>r.fecha===fecha&&r.chofer===chofer);
  return rows.length ? rows[rows.length-1] : null;
}
async function marcarCuadre(fecha,chofer,estado){
  const notaInput=document.getElementById('nota-cartera-'+chofer.replace(/[^a-zA-Z0-9]/g,'_'));
  const notaCartera=notaInput?notaInput.value.trim():'';
  try{
    await fetchConTimeoutR(API_URL,{
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({tipo:'cuadre_revision',fecha,chofer,estado,notaCartera})
    },25000);
  }catch(e){ /* no-cors: no podemos leer respuesta, seguimos igual */ }
  const row=CUADRE_ROWS.find(r=>r.fecha===fecha&&r.chofer===chofer);
  if(row){ row.estado=estado; row.notaCartera=notaCartera; }
  render();
}

function buildFiltroFecha(){
  const fechas=[...FECHAS_DISPONIBLES].sort().reverse();
  const sel=document.getElementById('sel-fecha');
  sel.innerHTML=fechas.map(f=>`<option value="${f}">${f}</option>`).join('');
  if(fechas.length) sel.value=fechas[0]; // más reciente por defecto
}

// Para cada chofer+fecha, calcula la bodega usada (la más reciente marcada en AVANCE)
function bodegaDe(fecha,chofer){
  const rows=AVANCE_ROWS.filter(r=>r.fecha===fecha&&r.chofer===chofer&&r.bodega).sort((a,b)=>a.ts.localeCompare(b.ts));
  return rows.length ? rows[rows.length-1].bodega : '';
}

function resumenCamion(fecha,chofer){
  const pedidos=MAPA_ROWS.filter(r=>r.fecha===fecha&&r.chofer===chofer);
  const totalPedidos=pedidos.length;
  const totalMonto=pedidos.reduce((s,r)=>s+r.total,0);
  const totalPeso=pedidos.reduce((s,r)=>s+r.peso,0);
  // último estado por código de cliente (por si hay filas viejas duplicadas)
  const porCodigo=new Map();
  AVANCE_ROWS.filter(r=>r.fecha===fecha&&r.chofer===chofer).forEach(r=>{
    const prev=porCodigo.get(r.codigo);
    if(!prev||r.ts>prev.ts) porCodigo.set(r.codigo,r);
  });
  let entregados=0,recaudado=0,porCobrarN=0,porCobrarVal=0,quemadosN=0,quemadoVal=0,quemPendVal=0,quemPendN=0,anuladosN=0;
  porCodigo.forEach(r=>{
    const pedido=pedidos.find(p=>p.codigo===r.codigo);
    const total=pedido?pedido.total:r.monto;
    if(r.estado==='ENTREGADO'||r.estado==='ENTREGADO_PARCIAL'){ entregados++; recaudado+=r.monto; }
    else if(r.estado==='POR_COBRAR'){ porCobrarN++; porCobrarVal+=total; }
    else if(r.estado==='QUEMADO'){
      quemadosN++; quemadoVal+=r.monto;
      const pend=Math.max(0,total-r.monto);
      if(pend>0.009){ quemPendN++; quemPendVal+=pend; }
    }
    else if(r.estado==='ANULADO'){ anuladosN++; }
  });
  const pendientes=Math.max(0,totalPedidos-entregados-porCobrarN-quemadosN-anuladosN);
  const pct=totalPedidos?Math.round((entregados+quemadosN+anuladosN+porCobrarN)/totalPedidos*100):0; // % de ruta "resuelta" (con algún estado)
  return {chofer,fecha,bodega:bodegaDe(fecha,chofer),totalPedidos,totalMonto,totalPeso,entregados,recaudado,porCobrarN,porCobrarVal,quemadosN,quemadoVal,quemPendN,quemPendVal,anuladosN,pendientes,pct};
}

function pillEstadoCuadre(estado){
  if(estado==='APROBADO') return `<span class="pill green">✅ Coincide</span>`;
  if(estado==='DIFERENCIA') return `<span class="pill" style="background:#7f1d1d;color:#fecaca">⚠️ Diferencia</span>`;
  return `<span class="pill orange">⏳ Pendiente</span>`;
}
function fotosHtml(fotos){
  if(!fotos||!fotos.length) return '<span style="color:#475569">Sin fotos</span>';
  return fotos.map((u,i)=>`<a href="${u}" target="_blank" style="color:#60a5fa;text-decoration:none;margin-right:6px">📷${i+1}</a>`).join('');
}
function renderTablaCuadres(fecha, choferesFiltrados){
  const cuadres=choferesFiltrados.map(c=>cuadreDe(fecha,c)).filter(Boolean);
  if(!cuadres.length){
    return `<div class="section-title">🧾 Cuadres de guía — ${fecha}</div><div class="empty" style="padding:20px">Todavía no se ha enviado ningún cuadre de guía para esta fecha.</div>`;
  }
  let html=`<div class="section-title">🧾 Cuadres de guía — ${fecha}</div>
  <table>
    <thead><tr>
      <th>Camión</th><th>$ Declarado</th><th>$ Sistema</th><th>Diferencia</th><th>Fotos</th><th>Observaciones</th><th>Estado</th>${esCartera?'<th>Acción</th>':''}
    </tr></thead>
    <tbody>`;
  cuadres.forEach(cu=>{
    const dif=cu.montoDeclarado-cu.montoSistema;
    const difColor=Math.abs(dif)<0.01?'#4ade80':'#ef4444';
    const idSeguro=cu.chofer.replace(/[^a-zA-Z0-9]/g,'_');
    html+=`<tr>
      <td><b>${cu.chofer}</b></td>
      <td>$${cu.montoDeclarado.toFixed(2)}</td>
      <td>$${cu.montoSistema.toFixed(2)}</td>
      <td style="color:${difColor};font-weight:700">${dif>=0?'+':''}$${dif.toFixed(2)}</td>
      <td>${fotosHtml(cu.fotos)}</td>
      <td style="max-width:160px;font-size:.68rem;color:#94a3b8">${cu.observaciones||'—'}</td>
      <td>${pillEstadoCuadre(cu.estado)}${cu.notaCartera?`<div style="font-size:.6rem;color:#94a3b8;margin-top:2px">${cu.notaCartera}</div>`:''}</td>
      ${esCartera?`<td>
        <input type="text" id="nota-cartera-${idSeguro}" placeholder="Nota (opcional)" value="${cu.notaCartera||''}" style="width:110px;font-size:.62rem;padding:3px 5px;border-radius:5px;background:#0f172a;border:1px solid #334155;color:#e2e8f0;margin-bottom:3px">
        <div style="display:flex;gap:3px">
          <button onclick="marcarCuadre('${fecha}','${cu.chofer}','APROBADO')" style="background:#15803d;border:none;color:#fff;padding:3px 6px;border-radius:5px;font-size:.6rem;cursor:pointer">✅</button>
          <button onclick="marcarCuadre('${fecha}','${cu.chofer}','DIFERENCIA')" style="background:#b91c1c;border:none;color:#fff;padding:3px 6px;border-radius:5px;font-size:.6rem;cursor:pointer">⚠️</button>
        </div>
      </td>`:''}
    </tr>`;
  });
  html+=`</tbody></table>`;
  return html;
}

async function render(){
  const fecha=document.getElementById('sel-fecha').value;
  if(!fecha) return;
  if(fecha<rangoCargado.desde || fecha>rangoCargado.hasta){
    document.getElementById('contenido').innerHTML=`<div class="loading" style="padding:30px"><div class="spinner"></div>Cargando ${fecha}...</div>`;
    try{ await asegurarRango(fecha,fecha); }
    catch(err){ document.getElementById('contenido').innerHTML=`<div style="color:#f87171;padding:20px">❌ ${err.message}</div>`; return; }
  }
  const camionSel=document.getElementById('sel-camion').value;
  const bodegaSel=document.getElementById('sel-bodega-f').value;
  document.getElementById('sub-info').textContent=fecha?`Fecha: ${fecha}`:'Sin datos';

  const choferes=[...new Set(MAPA_ROWS.filter(r=>r.fecha===fecha).map(r=>r.chofer))].sort();
  // refrescar opciones de camión (preservando selección si sigue existiendo)
  const selCam=document.getElementById('sel-camion');
  const prevVal=selCam.value;
  selCam.innerHTML=(esCartera?'<option value="">— Selecciona un camión —</option>':'<option value="">Todos</option>')+choferes.map(c=>`<option value="${c}">${c}</option>`).join('');
  selCam.value=choferes.includes(prevVal)?prevVal:'';

  let resumenes=choferes.map(c=>resumenCamion(fecha,c));
  if(bodegaSel) resumenes=resumenes.filter(r=>r.bodega===bodegaSel);
  if(selCam.value) resumenes=resumenes.filter(r=>r.chofer===selCam.value);

  const cont=document.getElementById('contenido');

  if(esCartera){
    renderDetalleCartera(cont, selCam.value?resumenes[0]:null, fecha);
    return;
  }

  if(!resumenes.length){
    cont.innerHTML=`<div class="empty">Sin datos para los filtros seleccionados.</div>`;
    document.getElementById('btn-ir-mapa').style.display='none';
    return;
  }

  // Totales globales
  const tot={pedidos:0,monto:0,entregados:0,recaudado:0,porCobrarVal:0,quemPendVal:0,anulados:0};
  resumenes.forEach(r=>{tot.pedidos+=r.totalPedidos;tot.monto+=r.totalMonto;tot.entregados+=r.entregados;tot.recaudado+=r.recaudado;tot.porCobrarVal+=r.porCobrarVal;tot.quemPendVal+=r.quemPendVal;tot.anulados+=r.anuladosN;});

  let html=`
  <div class="cards">
    <div class="card"><div class="v">${resumenes.length}</div><div class="l">Camiones</div></div>
    <div class="card"><div class="v">${tot.pedidos}</div><div class="l">Clientes totales</div></div>
    <div class="card green"><div class="v">$${tot.recaudado.toFixed(0)}</div><div class="l">Recaudado</div></div>
    <div class="card orange"><div class="v">$${tot.porCobrarVal.toFixed(0)}</div><div class="l">Por cobrar</div></div>
    <div class="card red"><div class="v">$${tot.quemPendVal.toFixed(0)}</div><div class="l">Pendiente en quemados</div></div>
    <div class="card"><div class="v">${tot.anulados}</div><div class="l">Anulados</div></div>
  </div>

  <div class="section-title">Resumen por camión — ${fecha}</div>
  <table>
    <thead><tr>
      <th>Camión</th><th>Bodega</th><th>Avance</th><th>Clientes</th><th>Entregados</th>
      <th>Por cobrar</th><th>Quemados</th><th>Anulados</th><th>$ Total</th><th>$ Recaudado</th><th></th>
    </tr></thead>
    <tbody>`;
  resumenes.sort((a,b)=>a.chofer.localeCompare(b.chofer)).forEach(r=>{
    const bNombre=r.bodega==='riobamba'?'Riobamba':r.bodega==='ambato'?'Ambato':'—';
    html+=`<tr>
      <td><b>${r.chofer}</b></td>
      <td>${bNombre}</td>
      <td><span class="bar-wrap"><span class="bar-fill" style="width:${r.pct}%"></span></span>${r.pct}%</td>
      <td>${r.totalPedidos}</td>
      <td><span class="pill green">${r.entregados}</span></td>
      <td>${r.porCobrarN} <span style="color:#64748b">($${r.porCobrarVal.toFixed(0)})</span></td>
      <td>${r.quemadosN}${r.quemPendN>0?` <span class="pill orange">${r.quemPendN} pend $${r.quemPendVal.toFixed(0)}</span>`:''}</td>
      <td>${r.anuladosN}</td>
      <td>$${r.totalMonto.toFixed(0)}</td>
      <td style="color:#4ade80;font-weight:700">$${r.recaudado.toFixed(0)}</td>
      <td><a class="btn-map" href="mapa_live_F150.html?fecha=${encodeURIComponent(r.fecha)}&chofer=${encodeURIComponent(r.chofer)}&bodega=${encodeURIComponent(r.bodega||'')}">🗺️ Ver</a></td>
    </tr>`;
  });
  html+=`</tbody></table>`;
  html+=renderTablaCuadres(fecha, resumenes.map(r=>r.chofer));
  cont.innerHTML=html;
  document.getElementById('btn-ir-mapa').style.display=selCam.value?'inline-block':'none';
  if(selCam.value) document.getElementById('btn-ir-mapa').href=`mapa_live_F150.html?fecha=${encodeURIComponent(fecha)}&chofer=${encodeURIComponent(selCam.value)}`;
}

function renderDetalleCartera(cont, r, fecha){
  if(!r){
    cont.innerHTML=`<div class="empty">Selecciona un camión arriba para ver el detalle de su ruta (${fecha||'—'}).</div>`;
    return;
  }
  const bNombre=r.bodega==='riobamba'?'Riobamba':r.bodega==='ambato'?'Ambato':'—';
  cont.innerHTML=`
  <div class="detail-card">
    <div class="detail-row"><span class="k">🚛 Camión</span><span class="v">${r.chofer}</span></div>
    <div class="detail-row"><span class="k">📅 Fecha</span><span class="v">${r.fecha}</span></div>
    <div class="detail-row"><span class="k">🏭 Bodega</span><span class="v">${bNombre}</span></div>
    <div class="detail-row"><span class="k">📦 Clientes</span><span class="v">${r.totalPedidos}</span></div>
    <div class="detail-row"><span class="k">✅ Entregados</span><span class="v" style="color:#4ade80">${r.entregados}</span></div>
    <div class="detail-row"><span class="k">🟠 Por cobrar</span><span class="v" style="color:#fb923c">${r.porCobrarN} — $${r.porCobrarVal.toFixed(2)}</span></div>
    <div class="detail-row"><span class="k">🔥 Quemados</span><span class="v">${r.quemadosN} — $${r.quemadoVal.toFixed(2)}</span></div>
    ${r.quemPendN>0?`<div class="detail-row"><span class="k">⚠️ Pendiente en quemados</span><span class="v" style="color:#f97316">$${r.quemPendVal.toFixed(2)}</span></div>`:''}
    <div class="detail-row"><span class="k">❌ Anulados</span><span class="v">${r.anuladosN}</span></div>
    <div class="detail-row"><span class="k">⏳ Pendientes</span><span class="v">${r.pendientes}</span></div>
    <div class="detail-row"><span class="k">💰 Total ruta</span><span class="v">$${r.totalMonto.toFixed(2)}</span></div>
    <div class="detail-row"><span class="k">✅ Recaudado</span><span class="v" style="color:#4ade80">$${r.recaudado.toFixed(2)}</span></div>
    <div class="detail-row"><span class="k">📈 Avance</span><span class="v">${r.pct}%</span></div>
  </div>
  ${renderTablaCuadres(fecha, [r.chofer])}`;
}

function setRangoRapido(dias){
  const fechas=[...FECHAS_DISPONIBLES].sort();
  if(!fechas.length) return;
  const hasta=fechas[fechas.length-1];
  const idx=Math.max(0, fechas.length-dias);
  document.getElementById('rango-desde').value=fechas[idx];
  document.getElementById('rango-hasta').value=hasta;
  renderRango();
}

async function renderRango(){
  const wrap=document.getElementById('rango-resumen');
  const desde=document.getElementById('rango-desde').value;
  const hasta=document.getElementById('rango-hasta').value;
  if(!desde||!hasta){ wrap.innerHTML=''; return; }
  if(desde<rangoCargado.desde || hasta>rangoCargado.hasta){
    wrap.innerHTML=`<div class="loading" style="padding:30px"><div class="spinner"></div>Cargando rango...</div>`;
    try{ await asegurarRango(desde,hasta); }
    catch(err){ wrap.innerHTML=`<div style="color:#f87171;padding:20px">❌ ${err.message}</div>`; return; }
  }
  const fechasEnRango=[...FECHAS_DISPONIBLES].filter(f=>f>=desde&&f<=hasta).sort();

  let totRecaudado=0, totPedidos=0, totAnulados=0, totQuemPend=0, totMonto=0;
  const porCamionAcum={};
  let filaDias='';

  fechasEnRango.forEach(f=>{
    const choferesDia=[...new Set(MAPA_ROWS.filter(r=>r.fecha===f).map(r=>r.chofer))];
    let recD=0,pedD=0,anulD=0,quemPendD=0,montoD=0;
    choferesDia.forEach(c=>{
      const r=resumenCamion(f,c);
      recD+=r.recaudado; pedD+=r.totalPedidos; anulD+=r.anuladosN; quemPendD+=r.quemPendVal; montoD+=r.totalMonto;
      if(!porCamionAcum[c]) porCamionAcum[c]={pedidos:0,recaudado:0,anulados:0,quemPend:0,total:0,dias:0};
      porCamionAcum[c].pedidos+=r.totalPedidos;
      porCamionAcum[c].recaudado+=r.recaudado;
      porCamionAcum[c].anulados+=r.anuladosN;
      porCamionAcum[c].quemPend+=r.quemPendVal;
      porCamionAcum[c].total+=r.totalMonto;
      porCamionAcum[c].dias+=1;
    });
    totRecaudado+=recD; totPedidos+=pedD; totAnulados+=anulD; totQuemPend+=quemPendD; totMonto+=montoD;
    filaDias+=`<tr><td>${f}</td><td>${choferesDia.length}</td><td>${pedD}</td><td style="color:#4ade80;font-weight:700">$${recD.toFixed(2)}</td><td>${anulD}</td><td style="color:${quemPendD>0.009?'#f97316':'#64748b'}">$${quemPendD.toFixed(2)}</td></tr>`;
  });

  let filasCamion='';
  Object.keys(porCamionAcum).sort().forEach(c=>{
    const a=porCamionAcum[c];
    filasCamion+=`<tr><td><b>${c}</b></td><td>${a.dias}</td><td>${a.pedidos}</td><td>$${a.total.toFixed(2)}</td><td style="color:#4ade80;font-weight:700">$${a.recaudado.toFixed(2)}</td><td>${a.anulados}</td><td style="color:${a.quemPend>0.009?'#f97316':'#64748b'}">$${a.quemPend.toFixed(2)}</td></tr>`;
  });

  wrap.innerHTML=`
    <div class="section-title">📅 Resumen del ${desde} al ${hasta} (${fechasEnRango.length} día${fechasEnRango.length===1?'':'s'} con rutas)</div>
    <div class="cards">
      <div class="card"><div class="v">${totPedidos}</div><div class="l">Pedidos totales</div></div>
      <div class="card"><div class="v">$${totMonto.toFixed(0)}</div><div class="l">Facturado</div></div>
      <div class="card green"><div class="v">$${totRecaudado.toFixed(0)}</div><div class="l">Recaudado</div></div>
      <div class="card red"><div class="v">$${totQuemPend.toFixed(0)}</div><div class="l">Pendiente en quemados</div></div>
      <div class="card orange"><div class="v">${totAnulados}</div><div class="l">Anulados</div></div>
    </div>
    <div class="section-title">📈 Por día</div>
    <table><thead><tr><th>Fecha</th><th>Camiones</th><th>Pedidos</th><th>Recaudado</th><th>Anulados</th><th>Pend. quemados</th></tr></thead>
    <tbody>${filaDias||'<tr><td colspan="6" style="text-align:center;color:#475569;padding:16px">Sin rutas en este rango</td></tr>'}</tbody></table>
    <div class="section-title">🚛 Por camión (acumulado del rango)</div>
    <table><thead><tr><th>Camión</th><th>Días activo</th><th>Pedidos</th><th>$ Total</th><th>$ Recaudado</th><th>Anulados</th><th>Pend. quemados</th></tr></thead>
    <tbody>${filasCamion||'<tr><td colspan="7" style="text-align:center;color:#475569;padding:16px">Sin datos</td></tr>'}</tbody></table>`;
}

cargarTodo();

// ── EXPORTAR ─────────────────────────────────────────────
function exportarExcel(){
  const tablas=document.querySelectorAll('#contenido table');
  if(!tablas.length){ alert('No hay datos para exportar todavía.'); return; }
  const wb=XLSX.utils.book_new();
  tablas.forEach((t,i)=>{
    const ws=XLSX.utils.table_to_sheet(t);
    const nombre=i===0?'Resumen':'Cuadres_'+i;
    XLSX.utils.book_append_sheet(wb, ws, nombre.substring(0,31));
  });
  const fecha=document.getElementById('sel-fecha').value||'reporte';
  XLSX.writeFile(wb, `Resumen_Mapas_${fecha}.xlsx`);
}
function exportarPDF(){
  window.print();
}
